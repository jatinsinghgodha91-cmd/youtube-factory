name: Motion Shorts (AI channel)

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motion-shorts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Code download karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Font aur ffmpeg install karo
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core ffmpeg

      - name: Libraries install karo
        run: pip install -r requirements.txt

      - name: Analytics aur comments se topic hint banao
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python analytics_pick.py

      - name: Motion Short banao
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python motion_ai.py

      - name: YouTube par upload karo
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python uploader.py

      - name: Comments ke reply drafts banao
        if: always()
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python reply_drafts.py

      - name: Instagram par post karo
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_REPO: jatinsinghgodha91-cmd/ig-media
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: python instagram_post.py

      - name: Facebook Page par post karo
        if: always()
        continue-on-error: true
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python facebook_post.py short

      - name: Output ko download ke liye save karo
        uses: actions/upload-artifact@v4
        with:
          name: motion-short-${{ github.run_number }}
          path: output/
          retention-days: 30
          if-no-files-found: warn

      - name: History, log, hint, comments aur drafts save karo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f motion_history.json ] && git add motion_history.json || true
          [ -f topic_hint.json ] && git add topic_hint.json || true
          [ -f reply_drafts.md ] && git add reply_drafts.md || true
          [ -f replied_ids.json ] && git add replied_ids.json || true
          [ -f video_log.json ] && git add video_log.json || true
          [ -d comments ] && git add comments || true
          if ! git diff --staged --quiet; then
            git commit -m "Update history, log, hint, comments and drafts after run ${{ github.run_number }}"
            for i in 1 2 3 4 5; do
              if git pull --rebase -X theirs && git push; then
                echo "Push ho gaya"
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
